<script src="config.js"></script>
<script>
    let isWaitingCode = false;
    let userEmail = "";

    document.getElementById('regBtn').onclick = async () => {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const btn = document.getElementById('regBtn');

        if (!isWaitingCode) {
            userEmail = prompt("Введите вашу почту для получения кода:");
            if (!userEmail) return;

            btn.disabled = true; btn.innerText = "ОТПРАВКА...";
            try {
                const res = await fetch(`${API}/register/init`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username, password, email: userEmail })
                });
                const data = await res.json();
                if (data.status === "success") {
                    isWaitingCode = true;
                    btn.disabled = false; btn.innerText = "ПОДТВЕРДИТЬ";
                    document.getElementById('username').value = "";
                    document.getElementById('username').placeholder = "Введите код из письма";
                    document.getElementById('password').style.display = "none";
                } else alert(data.message);
            } catch(e) { alert("Сервер недоступен"); }
            finally { if(!isWaitingCode) btn.disabled = false; }
        } else {
            const code = document.getElementById('username').value.trim();
            const res = await fetch(`${API}/register/confirm`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: userEmail, code: code })
            });
            if (res.ok) {
                alert("Аккаунт создан!");
                window.location.href = "login.html";
            } else alert("Неверный код");
        }
    };
</script>
