<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Titanium | Админ</title>
    <script src="config.js"></script>
    <style>
        body{background:#0a0f0a;color:#cfc;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:monospace;}
        .card{background:#0e150e;border:1px solid #2a4d2a;border-radius:32px;padding:40px;width:380px;text-align:center;}
        input, select{width:100%;padding:14px;margin:10px 0;background:#0a0f0a;border:1px solid #2a4d2a;border-radius:40px;color:#cfc;box-sizing:border-box;}
        button{background:#2ecc2e;border:none;padding:14px;border-radius:40px;font-weight:bold;width:100%;cursor:pointer;margin-top:10px;}
        a{color:#8bc48b;display:block;margin-top:20px;text-decoration:none;}
        hr{border:none;border-top:1px solid #2a4d2a;margin:20px 0;}
    </style>
</head>
<body>
<div class="card">
    <h2 style="color:#2ecc2e;margin-bottom:20px;">🛠 УПРАВЛЕНИЕ</h2>
    
    <input type="text" id="targetUser" placeholder="Логин игрока (кому выдаем)">
    
    <!-- Выдача баланса -->
    <input type="number" id="giveAmount" placeholder="Сумма баланса (₽)">
    <button id="btnBalance">ВЫДАТЬ БАЛАНС</button>

    <hr>

    <!-- Выдача подписки -->
    <select id="subItem">
        <option value="sub_30">Titanium Monthly (30 дней)</option>
        <option value="sub_life">Titanium Lifetime (Навсегда)</option>
        <option value="beta_access">Beta Test</option>
    </select>
    <button id="btnSub">ВЫДАТЬ ПОДПИСКУ</button>

    <a href="index.html">← На главную</a>
</div>

<script>
    const adminUser = localStorage.getItem('username');
    if (!adminUser) window.location.href = "login.html";

    // Выдача баланса
    document.getElementById('btnBalance').onclick = async () => {
        const target = document.getElementById('targetUser').value.trim();
        const amount = document.getElementById('giveAmount').value;
        if(!target || !amount) return alert("Укажи игрока и сумму");
        
        const res = await fetch(`${API}/api/admin/give`, {
            method:'POST', ...fetchConfig,
            body:JSON.stringify({admin_user: adminUser, target, balance: amount})
        });
        const data = await res.json();
        alert(data.message);
    };

    // Выдача подписки
    document.getElementById('btnSub').onclick = async () => {
        const target = document.getElementById('targetUser').value.trim();
        const item_id = document.getElementById('subItem').value;
        if(!target) return alert("Укажи игрока");

        const res = await fetch(`${API}/api/admin/give_sub`, {
            method:'POST', ...fetchConfig,
            body:JSON.stringify({admin_user: adminUser, target, item_id})
        });
        const data = await res.json();
        alert(data.message);
    };
</script>
</body>
</html>
